name: "DocDrift"
description: "Detect documentation that becomes outdated when code changes"

inputs:
  github-token:
    description: "GitHub token used to read pull request information"
    required: true
  config-path:
    description: "Path to the DocDrift configuration file"
    required: false
    default: ".docdrift.yml"

runs:
  using: "node24"
  main: "dist/index.js"
