version: 1

mode: report

detectors:
  packageScripts: true
  envVars: true
  apiRoutes: true
  semantic: false

semantic:
  confidenceThreshold: 0.80
  provider: gemini
  model: gemini-3.6-flash

paths:
  documentation:
    include:
      - "*.md"
      - "*.mdx"
      - "**/*.md"
      - "**/*.mdx"
    exclude: []
  ignore: []
