name: DocDrift Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docdrift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run DocDrift
        uses: ./
        with:
          github-token: ${{ github.token }}
