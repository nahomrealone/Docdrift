name: DocDrift Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  docdrift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run DocDrift
        uses: ./
        with:
          github-token: ${{ github.token }}
